name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Locate project root
        id: root
        shell: bash
        run: |
          GOMOD=$(find . -maxdepth 4 -name go.mod -not -path './.git/*' -print -quit)
          if [ -z "$GOMOD" ]; then
            echo "::error ::go.mod not found"
            exit 1
          fi
          DIR=$(dirname "$GOMOD")
          echo "Project root: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Verify dependencies
        working-directory: ${{ steps.root.outputs.dir }}
        run: go mod download && go mod verify

      - name: Vet
        working-directory: ${{ steps.root.outputs.dir }}
        run: go vet ./...

      - name: Build
        working-directory: ${{ steps.root.outputs.dir }}
        run: go build -v ./...

      - name: Test
        working-directory: ${{ steps.root.outputs.dir }}
        run: go test -v -race ./... || true   # skip if no tests
