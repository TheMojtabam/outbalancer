<text x="925" y="261" text-anchor="end" font-family="Vazirmatn" font-size="11" fill="#a8b0c9">یوتیوب، نتفلیکس و مرورگرها هر چند ثانیه chunk جدید می‌خوان. هر chunk از یه سرور = ۵+۵+۵=۱۵ مگ</text>
