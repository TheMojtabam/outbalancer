<text x="925" y="313" text-anchor="end" font-family="Vazirmatn" font-size="11" fill="#a8b0c9">فایل‌های مستقیم HTTPS رو با Range Requests میشکنیم به N تکه و موازی دانلود می‌کنیم.</text>
